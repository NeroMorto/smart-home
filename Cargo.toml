[package]
name = "smart-home-lib"
version = "0.1.0"
edition = "2024"


[dependencies]
actix-web = "4.13.0"
serde = { version = "1.0", features = ["derive"] }
env_logger = "0.11.10"
iced = { version = "0.14.0", features = ["tokio"] }
reqwest = { version = "0.13.4", features = ["json"] }
rand = "0.10.1"



[[bin]]
name = "with_emulators"
path = "src/with_emulators.rs"

[[bin]]
name = "gui-client"
path = "src/gui_client.rs"


[[bin]]
name = "api"
path = "src/api/mod.rs"

[[bin]]
name = "tcp-socket"
path = "src/tcp_socket_emulator.rs"

[[bin]]
name = "udp-thermometer"
path = "src/udp_thermometer_emulator.rs"

[dev-dependencies]
tempfile = "3.27.0"
actix-web = { version = "4", features = ["macros"] }
actix-http = "3.12.1"
serde_json = "1.0.150"
